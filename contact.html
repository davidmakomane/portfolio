<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | David Makomane</title>
  <link rel="icon" href="favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="container">
    <nav class="nav">
      <a class="logo" href="index.html">David<span>.</span></a>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a class="active" href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="container page-content contact-layout">
    
    <form class="contact-form" enctype="text/plain">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" placeholder="Write your message" required></textarea>
      <button class="button" type="submit">Send Message</button>
    </form>
  </main>
</body>
</html>
